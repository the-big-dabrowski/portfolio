<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; padding: 16px; color: var(--figma-color-text); background: var(--figma-color-bg); }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--figma-color-text-secondary); }
  textarea { width: 100%; height: 230px; box-sizing: border-box; font: 11px ui-monospace, monospace; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); cursor: pointer; }
  button.secondary { background: transparent; color: var(--figma-color-text); }
</style>
</head>
<body>
  <h1>Exportera design tokens</h1>
  <p>Spara filen som <code>design-tokens/figma-tokens.json</code> och kör <code>npm run tokens</code>.</p>
  <textarea id="out" readonly>Läser variabler…</textarea>
  <div class="actions">
    <button id="download">Ladda ner JSON</button>
    <button id="copy" class="secondary">Kopiera</button>
  </div>
<script>
  const out = document.getElementById('out');
  let json = '';
  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (msg.type === 'error') { out.value = 'Fel: ' + msg.message; return; }
    json = JSON.stringify(msg.tokens, null, 2) + '\n';
    out.value = json;
  };
  document.getElementById('download').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'figma-tokens.json';
    a.click();
  };
  document.getElementById('copy').onclick = () => { out.select(); document.execCommand('copy'); };
</script>
</body>
</html>
